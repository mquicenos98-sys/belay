# Schedules and the calendar they use, as configuration tables.
#
# Copy the tables you want into your belay.toml; the server creates or
# updates them at startup and leaves schedules created through the API
# alone. The file is also a complete configuration on its own, so
# `belay config check examples/schedules.toml` validates it.
#
# The same fields make a spec for the CLI: one schedule written as
# top-level keys (id = ..., cron = ..., [template]) can be loaded with
# `belay schedule add --file nightly.toml`.

# Office hours in Bogota. A fire that falls outside the windows or on an
# excluded date is skipped (a `schedule.skipped` event with reason
# `calendar`), not postponed.
[[calendars]]
name = "office-hours"
timezone = "America/Bogota"
description = "Weekdays 08:00-18:00, Saturday mornings, no public holidays"
exclude_dates = ["2026-12-08", "2026-12-25", "2027-01-01"]
windows = [
    { days = ["mon-fri"], start = "08:00", end = "18:00" },
    { days = ["sat"], start = "09:00", end = "13:00" },
]

# Nightly report. If belay was down at 02:30, one catch-up job runs when
# it comes back (fire_once); a report still running from the night before
# makes this fire skip (overlap = "skip").
[[schedules]]
id = "nightly-report"
cron = "30 2 * * *"
timezone = "America/Bogota"
description = "Yesterday's orders as a PDF"
misfire = "fire_once"
overlap = "skip"
template = { queue = "reports", kind = "build_report", payload = { range = "yesterday", format = "pdf" }, timeout = "45m", max_attempts = 3 }

# Every five minutes during office hours. Missed fires are not worth
# catching up (skip), and a slow run is replaced by the next one
# (cancel_previous asks the running job to stop).
[[schedules]]
id = "inventory-sync"
cron = "*/5 * * * *"
timezone = "America/Bogota"
calendar = "office-hours"
misfire = "skip"
overlap = "cancel_previous"
jitter = "20s"
[schedules.template]
queue = "sync"
kind = "sync_inventory"
priority = 10
timeout = "4m"
max_attempts = 1
tags = ["inventory"]

# Month-end close on the last weekday of the month at 18:00 (cron's LW),
# from November 2026 on. Up to three missed months are fired on restart.
[[schedules]]
id = "month-end-close"
cron = "0 18 LW * *"
timezone = "America/Bogota"
misfire = "fire_all:3"
starts_at = "2026-11-01T00:00:00-05:00"
[schedules.template]
queue = "finance"
kind = "close_month"
retry = "exp:1m*2..1h"
max_attempts = 5
meta = { owner = "finance-team" }

# A health ping every 30 seconds (six fields: the first is seconds),
# created paused; resume it with `belay schedule resume heartbeat-ping`.
[[schedules]]
id = "heartbeat-ping"
cron = "*/30 * * * * *"
paused = true
template = { queue = "default", kind = "echo", payload = { ping = true } }
