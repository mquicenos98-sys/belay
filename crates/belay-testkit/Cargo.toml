[package]
name = "belay-testkit"
description = "In-process harnesses for testing belay (servers, clusters, workers, fixtures) and the project's end-to-end test suite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[lib]
name = "belay_testkit"
path = "src/lib.rs"

[dependencies]
belay-common = { path = "../belay-common" }
belay-json = { path = "../belay-json" }
belay-proto = { path = "../belay-proto" }
belay-store = { path = "../belay-store" }
belay-core = { path = "../belay-core" }
belay-server = { path = "../belay-server" }
belay-client = { path = "../belay-client" }
belay-worker = { path = "../belay-worker" }
belay-cluster = { path = "../belay-cluster" }
